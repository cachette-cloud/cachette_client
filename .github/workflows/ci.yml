name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Run migrations
        working-directory: ./backend
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test_cachette.db
          SECRET_KEY: ci-test-secret-key
          AUTO_DOWNLOAD_BINARIES: "false"

      - name: Run tests
        working-directory: ./backend
        run: pytest
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test_cachette.db
          SECRET_KEY: ci-test-secret-key
          AUTO_DOWNLOAD_BINARIES: "false"

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Run linter
        working-directory: ./frontend
        run: pnpm lint

      - name: Build frontend
        working-directory: ./frontend
        run: pnpm build
        env:
          NEXT_PUBLIC_CENTRAL_URL: https://cachette.cloud

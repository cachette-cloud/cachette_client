services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  app:
    build: ./backend
    image: biswaman/cachette-backend:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/cachette.db
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: cachette-files
    volumes:
      - node_data:/data
    depends_on:
      minio:
        condition: service_started

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run --token ${CF_TUNNEL_TOKEN}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    image: biswaman/cachette-frontend:latest
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_CENTRAL_URL: https://cachette.cloud
    depends_on:
      - app

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data

volumes:
  node_data:
  miniodata:
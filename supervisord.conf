[supervisord]
nodaemon=true

[program:redis]
command=redis-server --daemonize no
autorestart=true
priority=1

[program:minio]
command=minio server /data/minio --console-address ":9001"
autorestart=true
priority=1

[program:migrate-and-backend]
command=bash -c "cd /app/backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
autorestart=true
priority=2

[program:frontend]
command=bash -c "cd /app/frontend && npm start -- -p 3000"
autorestart=true
priority=3
environment=NEXT_PUBLIC_API_URL="/api"